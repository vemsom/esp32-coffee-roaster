; Default target: pio run builds the flashable image. The OTA env below is
; built only when asked for (pio run -e esp32-ota ...) - it has no IP to upload
; to by default, and PIO refuses to invent one.
[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = adafruit/MAX6675 library@^1.1.2, bblanchon/ArduinoJson@^7.0.0, ESP32Async/ESPAsyncWebServer, ESP32Async/AsyncTCP, knolleary/PubSubClient@^2.8
build_flags = -D CORE_DEBUG_LEVEL=3
board_build.filesystem = littlefs
; Stämplar git-sha + byggtid i imagen (FW_BUILD_SHA/FW_BUILD_TIME), så
; /api/status kan bevisa vilket bygge som körs efter en push.
extra_scripts = pre:tools/fw_build_id.py

; Network upload, so the next update never needs the USB cable:
;   sh tools/ota-upload.sh 192.168.x.x
; or directly, with OTA_PASSWORD exported by hand (never written here - the
; script reads it from include/secrets.h at upload time, so nothing lands in
; git, in the shell history of whoever runs it, or in a chat log).
[env:esp32-ota]
extends = env:esp32dev
upload_protocol = espota
; espota slumpar returporten (10000-60000) om den inte pinnas, och da kan ingen
; smal brandvaggrseregel matcha trafiken. 32320 ligger under Linux ephemerala
; spann (32768-60999), sa OS:ets egna kallportar kan inte krocka.
; Lyssnaren binds till den har maskinens LAN-adress: utan -I gissar espota sin egen
; adress, och i en container med virtuella interface kan den binda fel -> enheten
; dialar tillbaka till ratt IP men ingen lyssnar dar ("No response from
; device" efter "Authenticating...OK").
;
; Flerradsformen nedan ar INTE kosmetisk: PlatformIO satter ihop
; upload_flags till EN strang, och skriver man allt pa en rad hamnar
; "-P 32320 -I <adress>" inuti --auth-vardet (espota svarar da
; "Authenticating...FAIL"). En flagga per rad ar det som ger separata argument.
; Priset ar ett inledande blanksteg per varde, som espota inte tål för -I
; ("[ERROR]: Listen Failed"). tools/ota-upload.sh anropar darfor espota.py
; direkt med argumenten som en lista - den vagen har ingen mellanhand.
;
; OTA_LISTEN_IP = den har maskinens LAN-adress (samma varde som
; OTA_ALLOWED_CLIENT_IP i include/secrets.h). Den star i miljon, inte i
; repo:t: repot ar publikt. Exportera den innan `pio run -e esp32-ota -t upload`:
;   export OTA_LISTEN_IP=192.168.x.x
; Utan den blir vardet tomt och espota dor pa "[ERROR]: Listen Failed" -
; anvand tools/ota-upload.sh (eller push-vagen) i stallet.
upload_flags =
    --auth=${sysenv.OTA_PASSWORD}
    -P 32320
    -I ${sysenv.OTA_LISTEN_IP}

; ---------------------------------------------------------------------------
; Maskinens eget bygglage: BT-only (SAFETY_ET_ENABLED 0), OTA som esp32-ota.
;
; VARFOR DEN FINNS: ET-kanalen pa DEN HAR maskinen ar dod hardvara. Termoelement-
; kretsen (MAX6675 + givare) ar trasig och ingen ny ar kopt (2026-10-19/20), sa
; BT-only ar ratt lage for maskinen - inte en tillfallig nodlosning. En ET-
; aktiverad bild (esp32dev/esp32-ota) larmar inom nagra sekunder pa den har
; hardvaran: safetyFault true, safetyReason "et sensor fault", heaterDuty 0 - och
; latchen gar inte att fa bort, eftersom den bara slapper efter en streak sampl
; dar BADA kanalerna ar friska. En ET som aldrig laser kan aldrig uppfylla det.
;
; VARFOR EN EGEN MILJO OCH INTE EN MILJOEVARIABEL: forra gangen byggdes bilden med
;   PLATFORMIO_BUILD_FLAGS='-D SAFETY_ET_ENABLED=0' pio run -e esp32-ota
; vilket fungerar precis en gang - nasta person (eller man sjalv, med bradom)
; kor `pio run -e esp32-ota`, far en ET-aktiverad bild och en maskin som gar i
; larm. Laget ska vara uttalat i repo:t, inte i skalhistoriken.
;
; DEFAULT-MILJOERNA AR MEDVETET OROERDA: repot ar publicerat och en generisk
; default ska vara generisk - ET pa, bada kanalerna. Maskinens lage hor till den
; har miljonen, inte till alla.
;
; Bygg och skicka (dokumenterat i docs/firmware-notes.md, "Maskinens bygglage"):
;   pio run -e esp32-ota-bt                  # app-bild
;   pio run -e esp32-ota-bt -t buildfs       # filsystemsbild (webb-UI:t)
;   OTA_ENV=esp32-ota-bt sh tools/ota-push.sh <ip>        # app
;   OTA_ENV=esp32-ota-bt sh tools/ota-push.sh <ip> fs     # filsystem
;
; DEN DAG GIVAREN/MODULEN AR BYTT: bygg med esp32-ota igen (default, ET pa),
; kontrollera att /api/status visar etDisabled:false och ett levande et, och
; sluta anvanda den har miljonen. Inget annat behover andras darvid -
; ROR_GUIDANCE_ON_BT foljer SAFETY_ET_ENABLED automatiskt (include/config.h), sa
; en bild med flaggan 1 styr RoR-regleringen pa rorEt igen.
;
; build_flags upprepas fran esp32dev MED FLIT: PlatformIO ERSATTER listan i en
; extends-miljo i stallet for att lagga ihop den (kontrollerat med `pio run -t
; envdump`: barnets build_flags ar hela listan). Utan upprepningen tappas
; -D CORE_DEBUG_LEVEL=3 tyst, och den har miljonen skiljer sig fran esp32-ota i
; nagot annat an just ET-flaggan.
[env:esp32-ota-bt]
extends = env:esp32-ota
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D SAFETY_ET_ENABLED=0
